# Supabase ücretsiz planı 7 gün API isteği görmeyince projeyi duraklatır ve
# DNS kaydı kalkar (uygulama "Network request failed" atar). Bu iş her gün
# RLS'li bir tabloya tek bir okuma isteği atarak projeyi uyanık tutar.
#
# Gerekli repo sırları (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       = https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  = anon/publishable key (.env içindeki EXPO_PUBLIC_SUPABASE_ANON_KEY)
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 6 * * *'   # her gün 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" -a -n "$KEY" || { echo "SUPABASE_URL / SUPABASE_ANON_KEY sırları eksik"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$URL/rest/v1/sheets?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          test "$code" = "200"
